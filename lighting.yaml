dirigera:
  hub_ip: 192.168.86.27
  token_file: dirigera_token
location:
  name: San Francisco
  region: America
  timezone: America/Los_Angeles
  lat: 37.7614418
  lon: -122.3940788
zones:
  - name: "Living room"
    routine: "Rainbow"
    devices: []
    device_sets:
      - "Ceiling Lamp"
routines:
  - name: "Main"
    data:
      "dawn+80%":
        temp: 2202
        intensity: 0
      "sunrise+20%":
        temp: 3000
        intensity: 100
      "noon":
        temp: 3700
        intensity: 0
      "noon+80%":
        temp: 3700
        intensity: 0
      "sunset":
        temp: 3700
        intensity: 50
      "dusk":
        temp: 2202
        intensity: 20
      "dusk + 30%":
        temp: 2202
        intensity: 10
        hue: 0
        saturation: 1
      "dusk + 80%":
        temp: 2202
        intensity: 0
        hue: 0
        saturation: 0
  - name: "Rainbow"
    data:
      "00:00":
        temp: 2202
        intensity: 0
        hue: 0  # Starting hue at dawn
        saturation: 1
      "01:00":
        temp: 3000
        intensity: 100
        hue: 60  # Hue advancing during sunrise
        saturation: 1
      "02:00":
        temp: 3700
        intensity: 100
        hue: 180  # Midday hue (greenish)
        saturation: 1
      "03:00":
        temp: 3700
        intensity: 100
        hue: 240  # Early afternoon hue (blue)
        saturation: 1
      "04:00":
        temp: 3700
        intensity: 50
        hue: 300  # Evening hue (purple)
        saturation: 1
      "06:00":
        temp: 2202
        intensity: 20
        hue: 360  # Completing the cycle at dusk
        saturation: 1
      "dawn":
        temp: 2202
        intensity: 10
        hue: 0  # Cycle restarts after dusk
        saturation: 1
      "10:00":
        temp: 2202
        intensity: 0
        hue: 0
        saturation: 0
