[project]
name = "lighting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astral>=3.2",
    "click>=8.1.7",
    "dirigera>=1.1.9",
    "illumipy>=1.4.26",
    "matplotlib>=3.9.2",
    "numpy>=2.1.1",
    "pydantic>=2.9.2",
    "pytz>=2024.2",
    "pyyaml>=6.0.2",
]

[project.scripts]
lighting = "lighting.main:main"
old = "lighting.lighting:main"
calibrate = "lighting.calibrate:main"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["daxi", "Camera"]
